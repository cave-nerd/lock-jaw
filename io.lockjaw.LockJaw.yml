app-id: io.lockjaw.LockJaw
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: lockjaw

finish-args:
  # Display
  - --socket=x11
  - --socket=wayland
  - --device=dri           # GPU / OpenGL access for egui rendering
  # Network (WebDAV sync)
  - --share=network
  # File access — vault can live anywhere in home
  - --filesystem=home
  # Allow reading the XDG config dir (config.toml lives in ~/.config/lockjaw/)
  - --filesystem=xdg-config/lockjaw:create

modules:
  - name: lockjaw
    buildsystem: simple
    build-commands:
      # Binary
      - install -Dm755 lockjaw /app/bin/lockjaw
      # Desktop entry
      - install -Dm644 io.lockjaw.LockJaw.desktop /app/share/applications/io.lockjaw.LockJaw.desktop
      # Icons
      - install -Dm644 lockjaw-256.png
          /app/share/icons/hicolor/256x256/apps/io.lockjaw.LockJaw.png
      # AppStream metainfo
      - install -Dm644 io.lockjaw.LockJaw.metainfo.xml
          /app/share/metainfo/io.lockjaw.LockJaw.metainfo.xml

    sources:
      - type: file
        path: target/release/lockjaw

      - type: file
        path: io.lockjaw.LockJaw.desktop

      - type: file
        path: dist/LockJaw.AppDir/lockjaw.png
        dest-filename: lockjaw-256.png

      - type: file
        path: io.lockjaw.LockJaw.metainfo.xml
