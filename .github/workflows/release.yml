name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-appimage:
    name: Build AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential pkg-config \
            libssl-dev libgl-dev libfontconfig-dev \
            libwayland-dev libxkbcommon-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxrandr-dev libxi-dev libudev-dev \
            libdbus-1-dev \
            python3-pil \
            appstream

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.arch }}-cargo-

      - name: Build AppImage
        run: ./build-appimage.sh

      - name: Rename artifact with version tag
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCH="${{ matrix.arch }}"
          mv "dist/LockJaw-${ARCH}.AppImage" "LockJaw-${VERSION}-${ARCH}.AppImage"

      - name: Create GitHub Release and upload AppImage
        uses: softprops/action-gh-release@v2
        with:
          files: LockJaw-*.AppImage
          generate_release_notes: true
